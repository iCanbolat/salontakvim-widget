<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalonTakvim Booking Widget</title>
    <meta
      name="description"
      content="Book your appointment easily with SalonTakvim"
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Preconnect to API -->
    <link rel="preconnect" href="https://api.salontakvim.com" />
    <link rel="dns-prefetch" href="https://api.salontakvim.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <style>
      /* Reset & Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Widget Container */
      #root {
        width: 100%;
        padding: 1rem;
      }

      @media (min-width: 1024px) {
        #root {
          padding: 2rem 1rem;
        }
      }

      /* Loading State */
      .widget-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        font-size: 14px;
        color: #666;
      }

      /* Error State */
      .widget-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        padding: 2rem;
        text-align: center;
        color: #dc2626;
      }

      .widget-error h2 {
        font-size: 20px;
        margin-bottom: 0.5rem;
      }

      .widget-error p {
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="widget-loading">
        <span>Loading booking widget...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
